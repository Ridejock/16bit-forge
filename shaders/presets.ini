; SPDX-License-Identifier: MIT
; Filter presets for the GPU renderer (View > Filter). Read at startup from shaders/presets.ini
; next to the executable; the menu lists them in this order.
;
; [preset name]
; pass = <shader>, <scale type>, <scale>, <filter>[, <option>...]   one line per pass, top to bottom
; param = <name>, <value>                                          any number, anywhere in the preset
;
;   shader      a fragment shader in this folder, without ".frag.hlsl" (xbr_lv2 -> xbr_lv2.frag.hlsl)
;   scale type  source   = output is <scale> x this pass's input
;               viewport = output is <scale> x the on-screen picture
;   scale       a number for both axes (2), or <x>x<y> for each (4x1)
;   filter      nearest or linear: how this pass samples its inputs
;   options     float         the output is 16-bit float instead of 8-bit (signals, metrics)
;               name <word>   later passes can read this pass's output as an input
;               input <word>  an extra input: "original" (the emulator frame) or an earlier
;                             pass's name. The shader reads them from slot 1 on, in this order.
;   param       sets a shader parameter in every pass whose shader declares it (its
;               "// @param <name> <default>" lines); the rest keep their defaults.
;
; The last pass always draws into the letterboxed on-screen picture, so its scale type, scale and
; float are ignored. The SDL_Renderer fallback can't run shaders: it uses the first pass's filter.
; To add a filter: drop <name>.frag.hlsl in this folder (include filter_common.hlsli for the
; Source texture, sizes and Parameter()) and add a section here. No C++ changes; re-run CMake so
; it compiles.

[nearest]
pass = stock, viewport, 1, nearest

[sharp-bilinear]
pass = sharp_bilinear, viewport, 1, linear

[xbr]
pass = xbr_lv2, source, 2, nearest
pass = xbr_lv2, source, 2, nearest
pass = sharp_bilinear, viewport, 1, linear

[scalefx]
pass = scalefx_pass0, source, 1, nearest, float, name metric
pass = scalefx_pass1, source, 1, nearest, float
pass = scalefx_pass2, source, 1, nearest, input metric
pass = scalefx_pass3, source, 1, nearest
pass = scalefx_pass4, source, 3, nearest, input original
pass = sharp_bilinear, viewport, 1, linear

[crt-scanlines]
pass = crt_scanlines, viewport, 1, linear

[crt-lottes]
pass = crt_lottes, viewport, 1, nearest
param = curvature, 0.03
param = corner_radius, 0.08
param = corner_softness, 0.015

[crt-lottes-flat]
pass = crt_lottes, viewport, 1, nearest

[ntsc-composite]
pass = ntsc, source, 4x1, nearest
pass = crt_lottes, viewport, 1, nearest
param = hard_pix, -1.5
param = curvature, 0.03
param = corner_radius, 0.08
param = corner_softness, 0.015

[ntsc-svideo]
pass = ntsc, source, 4x1, nearest
pass = crt_lottes, viewport, 1, nearest
param = ntsc_svideo, 1
param = hard_pix, -1.5
param = curvature, 0.03
param = corner_radius, 0.08
param = corner_softness, 0.015
