; Default settings, copied next to the executable by the release package. The emulator
; rewrites this file when you change settings in the UI.
[view]
scale=3
integer_scaling=1
aspect_8_7=0
show_log=1

[video]
renderer=gpu
filter=nearest

[audio]
volume=100
msu1_volume=100
muted=0
sync_to_audio=0

[speed]
rewind=1
rewind_budget_mb=64
rewind_interval=4
rewind_audio=mute
fast_forward_speed=4

[ports]
port1=gamepad
port2=gamepad
mouse_speed=100
crosshair=1

[hotkeys]
Rewind=Backspace
Rewind.pad=lefttrigger
FastForward=Tab
FastForward.pad=righttrigger
FastForwardToggle=`
FastForwardToggle.pad=rightstick

[keys]
B=Z
Y=A
Select=Right Shift
Start=Return
Up=Up
Down=Down
Left=Left
Right=Right
A=X
X=S
L=Q
R=W

